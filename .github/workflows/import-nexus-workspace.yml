name: Import NEXUS workspace (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-nexus-workspace.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Verify and extract exact archive
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, subprocess, stat
          archive = pathlib.Path('NEXUS_Antigravity_workspace.zip')
          assert subprocess.check_output(['git', 'hash-object', str(archive)], text=True).strip() == 'e04b6d6851c0345a24d09359837b35f455eb8661'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              seen = set()
              entries = []
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename
                  assert not any(part.lower() in ('.git', '.github') for part in p.parts)
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  assert p.parts[0] in ('nexus', 'reference', 'NEXUS_ANTIGRAVITY_HANDOFF.md')
                  if item.is_dir(): continue
                  assert p not in seen
                  seen.add(p)
                  target = pathlib.Path(*p.parts)
                  if target.exists():
                      assert target.is_file() and target.read_bytes() == z.read(item), f'Collision: {target}'
                  entries.append((item, target))
              assert len(entries) == 175
              for item, target in entries:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
              print(f'Verified and extracted {len(entries)} files')
          PY
          git add -f -- nexus reference NEXUS_ANTIGRAVITY_HANDOFF.md
          if git diff --cached --quiet; then
            echo "Workspace already imported."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Import complete NEXUS Antigravity workspace"
          git push origin HEAD:main
